<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藍牙實體玩具互動小遊戲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header style="display: flex; align-items: center; gap: 10px; padding: 20px 28px;">
    <img src="IMG_1534.jpg" alt="HeartSync Logo"
         style="width: 65px; height: 65px; object-fit: contain; border-radius: 10px;">

    <h1 style="margin: 0; font-size: 28px; color: #633F4E;">
      HeartSync
    </h1>

<div style="margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">

<div style="
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  padding: 10px 14px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(99, 63, 78, 0.04);
">

  <svg width="19" height="19"
       viewBox="0 0 24 24"
       fill="none"
       stroke="#633F4E"
       stroke-width="1.8"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="m5 8 6 6"/>
    <path d="m4 14 6-6 2-3H2"/>
    <path d="M2 5h12"/>
    <path d="M7 2h1"/>
    <path d="m22 22-5-10-5 10"/>
    <path d="M14 18h6"/>
  </svg>

  <select id="language-select"
          aria-label="Choose language"
          style="
    border: none;
    background: transparent;
    color: #633F4E;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    width: 76px;
    appearance: none;
    -webkit-appearance: none;
  ">
    <option value="en">English</option>
    <option value="zh">中文</option>
  </select>

  <svg width="15" height="15"
       viewBox="0 0 24 24"
       fill="none"
       stroke="#633F4E"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="m6 9 6 6 6-6"/>
  </svg>

</div>

<span style="
  background: #B27C89;
  color: white;
  padding: 10px 18px;
  border-radius: 16px;
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
">
  Log in
</span>

</div>

</header>

<nav style="display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 28px 25px;">
  <a data-i18n="navHome" href="#home" style="background: white; color: #633F4E; padding: 12px 20px; border-radius: 12px; text-decoration: none;">Home</a>

  <a data-i18n="navAbout" href="#about" style="background: white; color: #633F4E; padding: 12px 20px; border-radius: 12px; text-decoration: none;">About Us</a>
  
  <a data-i18n="navPlay" href="#play" style="background: white; color: #633F4E; padding: 12px 20px; border-radius: 12px; text-decoration: none;">Play</a>
  
  <a data-i18n="navParents" href="#parents" style="background: white; color: #633F4E; padding: 12px 20px; border-radius: 12px; text-decoration: none;">Parents</a>
</nav>
<section id="home" style="
  background-color: #F5E7DB;
  max-width: 900px;
  margin: 20px auto 35px;
  padding: 55px 25px;
  border-radius: 22px;
  text-align: center;

<p data-i18n="welcome" style="color: #A37173; font-weight: bold;">
  WELCOME TO HEARTSYNC
</p>

<h2 data-i18n="slogan" style="color: #633F4E; font-size: clamp(28px, 5vw, 44px);">
    Music Lights Brighter Tomorrows
  </h2>

<p data-i18n="description" style="color: #80636B; font-size: 18px;">
    Learning English through rhythm, light and play.
  </p>
</section>
  <div class="container">
    
    <!-- 藍牙連線控制區 -->
    <div class="card">
      <button id="connect-btn" class="btn primary">🔗 連接藍牙玩具</button>
      <span id="status" class="status-disconnected">狀態：未連線</span>
    </div>

    <!-- 玩具控制測試面板 (Web -> Toy) -->
    <div class="card">
      <h3>發送指令給玩具 (Write 特徵值)</h3>
      <div class="control-group">
        <button id="btn-vibrate" class="btn" disabled>📳 觸發玩具震動 (500ms)</button>
        <button id="btn-led-red" class="btn red" disabled>🔴 玩具亮紅燈</button>
        <button id="btn-led-green" class="btn green" disabled>🟢 玩具亮綠燈</button>
      </div>
    </div>

    <!-- 數據接收顯示區 (Toy -> Web) -->
    <div class="card">
      <h3>玩具傳回數據 (Notify 特徵值)</h3>
      <div class="telemetry">
        <p>最後按鈕動作：<strong id="toy-button">無</strong></p>
        <p>玩具傾斜角度 (Tilt Roll)：<strong id="toy-tilt">0</strong>°</p>
      </div>
    </div>

    <!-- 遊戲畫布區 -->
    <div class="card">
      <h3>互動遊戲：避開隕石</h3>
      <p class="hint">說明：左右傾斜玩具控制飛船移動，按下玩具按鈕或點擊畫面發射雷射！</p>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
